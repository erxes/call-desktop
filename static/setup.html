<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Connect to erxes</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 40px 32px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      p {
        margin: 0 0 20px;
        opacity: 0.7;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 8px 10px;
        font: inherit;
        border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
        border-radius: 6px;
      }
      button {
        margin-top: 16px;
        padding: 8px 16px;
        font: inherit;
        font-weight: 500;
        color: #fff;
        background: #4f46e5;
        border: 0;
        border-radius: 6px;
      }
      [role='alert'] {
        min-height: 21px;
        margin: 8px 0 0;
        color: #dc2626;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <h1>Connect to erxes</h1>
    <p>Enter the address you open erxes at in your browser.</p>
    <form>
      <label for="address">Address</label>
      <input
        id="address"
        name="address"
        placeholder="https://example.erxes.io"
        required
        autofocus
      />
      <p role="alert"></p>
      <button type="submit">Connect</button>
    </form>
  </body>
</html>
